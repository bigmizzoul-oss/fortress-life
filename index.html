<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>棱堡生活：边境往事</title><style>*{box-sizing:border-box}body{margin:0;background:#151a1c;color:#f5e8cb;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;left:12px;top:10px;background:#17201dcc;border:1px solid #c4a87588;padding:9px 12px;border-radius:8px;font-size:13px;pointer-events:none;max-width:78vw}#msg{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#171b1de8;padding:10px 16px;border-radius:9px;text-align:center;min-width:180px;max-width:88vw;font-size:14px;pointer-events:none}#controls{position:fixed;bottom:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}button{touch-action:none;pointer-events:auto;background:#292e2cdd;color:#f7e8c9;border:1px solid #d2b477;border-radius:50%;width:55px;height:55px;font-weight:bold;font-size:16px}#pad{display:grid;grid-template-columns:repeat(3,49px);grid-template-rows:repeat(2,49px);gap:3px}#pad button{width:49px;height:49px}#actions{display:flex;gap:9px;align-items:end}#actions button{width:64px;height:64px}#intro{position:fixed;inset:0;background:#121b1de9;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;z-index:10}#intro>div{max-width:500px}#intro h1{font-family:serif;font-size:35px;color:#e4c58b}#intro p{line-height:1.8}#start{border-radius:9px;width:auto;padding:0 26px;background:#7b5636}@media(max-width:400px){#controls{left:10px;right:10px;bottom:max(12px,env(safe-area-inset-bottom));gap:8px}#pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px)}#pad button{width:44px;height:44px}#actions{gap:4px}#actions button{width:clamp(44px,14vw,54px);height:clamp(44px,14vw,54px)}#msg{bottom:112px}}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="msg">走近居民按「交谈」</div><div id="controls"><div id="pad"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div id="actions"><button id="talk">交谈<br> E</button><button id="horse">骑马<br> R</button><button id="shoot">射击<br> 空格</button></div></div><div id="intro"><div><h1>棱堡生活<br>边境往事</h1><p>1898 年，荒漠边境的星角堡。<br>酒馆老板丢了补给，哨兵看见了可疑的匪徒。<br>这里没有英雄，只有你的选择。</p><p style="font-size:13px;color:#c7b995">电脑：WASD 移动、E 交谈、R 骑马、空格射击<br>手机：屏幕下方按钮操作</p><button id="start">踏入边境</button></div></div><script>
const C=document.getElementById('game'),X=C.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('msg');let W=innerWidth,H=innerHeight,dpr=1;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();let running=false,keys={},time=8*60,day=1,coins=12,hp=100,ammo=24,wanted=0,kills=0,quest=0,questDone=false,horseOn=false,shots=[],dust=[],flash=0,noticeUntil=0;const world={w:1800,h:1400},p={x:900,y:720,dir:0};const npcs=[{x:780,y:620,n:'酒馆老板',c:'#b65c42',line:'商队补给被土匪抢走了。帮我解决北边的三个匪徒，赏你 $30。'},{x:1110,y:660,n:'堡垒哨兵',c:'#517f85',line:'北门外有匪徒出没。带够弹药再去。'},{x:920,y:940,n:'马夫',c:'#c49a57',line:'这匹栗色马认你了。靠近马按 R 就能骑。'},{x:670,y:880,n:'镇民艾达',c:'#9675a9',line:'晚上酒馆灯火亮起，堡垒就像一座小小的城市。'},{x:1160,y:930,n:'杂货商',c:'#638f60',line:'子弹一盒 $5，补充 12 发。',shop:true}];let bandits=[{x:620,y:270,hp:3},{x:900,y:225,hp:3},{x:1200,y:290,hp:3}];const horse={x:1000,y:980};const buildings=[{x:630,y:490,w:240,h:170,n:'金鹿酒馆',c:'#81543c'},{x:1010,y:510,w:220,h:150,n:'守备营房',c:'#776a58'},{x:570,y:790,w:180,h:160,n:'居民小屋',c:'#8d765b'},{x:1050,y:800,w:230,h:170,n:'杂货铺',c:'#897052'},{x:820,y:1020,w:190,h:125,n:'马厩',c:'#775a3e'}];function say(t,sec=4){msg.textContent=t;noticeUntil=performance.now()+sec*1000}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function talk(){let n=npcs.reduce((a,b)=>dist(p,a)<dist(p,b)?a:b);if(dist(p,n)>125){say('附近没人能听到你说话。');return}if(n.shop){if(coins>=5){coins-=5;ammo+=12;say('买到 12 发子弹，花费 $5。')}else say('钱不够买子弹。');return}if(n.n==='酒馆老板'){if(kills>=3&&!questDone){questDone=true;coins+=30;wanted=0;say('老板：干得漂亮！这是 $30，堡垒欠你一个人情。',6)}else if(!quest){quest=1;say('任务开启：清除北门外的 3 名匪徒！',5)}else say(kills<3?`还剩 ${3-kills} 个匪徒。注意安全！`:'回头来找我领赏。')}else say(n.n+'：'+n.line,5)}function mount(){if(horseOn){horseOn=false;horse.x=p.x+35;horse.y=p.y+30;say('你翻身下马。');return}if(dist(p,horse)<115){horseOn=true;say('骑上栗色马，移动速度提高！')}else say('马匹离你太远了。')}function shoot(){if(!running||ammo<=0){say('没有子弹了，去杂货铺补给。');return}ammo--;flash=7;let target=bandits.filter(b=>b.hp>0&&dist(p,b)<390).sort((a,b)=>dist(p,a)-dist(p,b))[0];let angle=p.dir;if(target){angle=Math.atan2(target.y-p.y,target.x-p.x);target.hp--;if(target.hp<=0){kills++;coins+=4;say(`击倒匪徒！$4 战利品（${kills}/3）`);if(kills===3)say('匪徒已清除！回酒馆找老板领赏。',6)}}else{wanted=Math.min(5,wanted+1);say('枪声在荒漠回荡……')}shots.push({x:p.x,y:p.y,angle,life:13});}function rect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}function label(t,x,y,color='#f9eac8',size=13){X.font=`bold ${size}px system-ui`;X.textAlign='center';X.fillStyle='#17201d';X.fillText(t,x+1,y+2);X.fillStyle=color;X.fillText(t,x,y)}function person(x,y,c,hat=true){X.fillStyle='#26231e';X.beginPath();X.ellipse(x,y+11,13,5,0,0,7);X.fill();X.fillStyle=c;X.fillRect(x-8,y-5,16,19);X.fillStyle='#d7ad80';X.beginPath();X.arc(x,y-11,8,0,7);X.fill();if(hat){rect(x-13,y-20,26,5,'#3b3027');rect(x-8,y-27,16,9,'#3b3027')}}function draw(){let camX=p.x-W/2,camY=p.y-H/2;X.clearRect(0,0,W,H);X.save();X.translate(-camX,-camY);rect(0,0,world.w,world.h,'#b49b69');for(let i=0;i<350;i++){let x=(i*173+57)%world.w,y=(i*293+81)%world.h;rect(x,y,3+(i%4),2,'#a58d60')} // bastion star walls
X.beginPath();[[350,440],[540,440],[570,360],[720,440],[1080,440],[1230,360],[1260,440],[1450,440],[1450,1070],[1260,1070],[1230,1150],[1080,1070],[720,1070],[570,1150],[540,1070],[350,1070]].forEach(([x,y],i)=>i?X.lineTo(x,y):X.moveTo(x,y));X.closePath();X.strokeStyle='#594f3c';X.lineWidth=36;X.stroke();X.strokeStyle='#b8a780';X.lineWidth=21;X.stroke();rect(825,415,150,50,'#b49b69');rect(825,1060,150,50,'#b49b69');for(let i=0;i<18;i++){let x=180+i*85;X.fillStyle='#827e49';X.beginPath();X.arc(x,130+(i%4)*30,10+(i%3)*6,0,7);X.fill()}for(const b of buildings){rect(b.x+10,b.y+12,b.w,b.h,'#67543f');rect(b.x,b.y,b.w,b.h,b.c);X.strokeStyle='#423b31';X.lineWidth=5;X.strokeRect(b.x,b.y,b.w,b.h);rect(b.x+b.w/2-16,b.y+b.h-15,32,15,'#382c23');for(let j=0;j<3;j++)rect(b.x+20+j*65,b.y+30,25,24,'#e5c17b');label(b.n,b.x+b.w/2,b.y-12)}for(const n of npcs){person(n.x,n.y,n.c);label(n.n,n.x,n.y-36)}if(!horseOn){X.fillStyle='#72452e';X.beginPath();X.ellipse(horse.x,horse.y,22,12,0,0,7);X.fill();X.beginPath();X.arc(horse.x+18,horse.y-9,9,0,7);X.fill();label('栗色马',horse.x,horse.y-29)}for(const b of bandits)if(b.hp>0){person(b.x,b.y,'#6e3330');label('匪徒 ♥'.repeat(1)+b.hp,b.x,b.y-38,'#ffc0a7')}if(horseOn){X.fillStyle='#70422c';X.beginPath();X.ellipse(p.x,p.y+10,25,14,0,0,7);X.fill()}person(p.x,p.y,'#355a69');label('你',p.x,p.y-39,'#ffffff');for(const s of shots){X.strokeStyle='#ffdc84';X.lineWidth=3;X.beginPath();X.moveTo(s.x,s.y);X.lineTo(s.x+Math.cos(s.angle)*380,s.y+Math.sin(s.angle)*380);X.stroke()}X.restore();let night=Math.max(0,Math.min(.62,(time%1440<360?(360-time%1440)/360:(time%1440>1080?(time%1440-1080)/360:0))*.72));if(night){X.fillStyle=`rgba(9,19,39,${night})`;X.fillRect(0,0,W,H)}let hh=Math.floor(time%1440/60),mm=Math.floor(time%60);hud.innerHTML=`🌵 星角堡 · 第 ${day} 天　${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}<br>❤️ ${Math.max(0,Math.round(hp))}　💵 $${coins}　🔫 ${ammo} 发　🐎 ${horseOn?'骑乘':'步行'}<br>📜 ${questDone?'补给追回 · 已完成':quest?`清剿匪徒 ${kills}/3`:'去酒馆接任务'}`;if(performance.now()>noticeUntil)msg.textContent='WASD/方向键移动 · E 交谈 · R 骑马 · 空格射击';}let last=0;function tick(now){requestAnimationFrame(tick);if(!running)return;let dt=Math.min((now-last)/16.67||1,2);last=now;let dx=(keys.right||keys.d?1:0)-(keys.left||keys.a?1:0),dy=(keys.down||keys.s?1:0)-(keys.up||keys.w?1:0);if(dx||dy){let len=Math.hypot(dx,dy),speed=(horseOn?5.4:3.1)*dt;p.x=Math.max(40,Math.min(world.w-40,p.x+dx/len*speed));p.y=Math.max(45,Math.min(world.h-45,p.y+dy/len*speed));p.dir=Math.atan2(dy,dx)}time+=dt*.13;if(time>=day*1440){day++;}for(let b of bandits){if(b.hp>0&&dist(p,b)<180&&Math.random()<.005*dt){hp-=8;say('匪徒开火！你受伤了！');if(hp<=0){hp=100;p.x=900;p.y=720;coins=Math.max(0,coins-10);say('你在医务室醒来，损失了 $10。',5)}}}shots=shots.filter(s=>--s.life>0);if(flash>0)flash--;draw()}requestAnimationFrame(tick);document.getElementById('start').onclick=()=>{document.getElementById('intro').remove();running=true;last=performance.now();say('欢迎来到星角堡。先去左上方的金鹿酒馆！',6)};addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='e')talk();if(k==='r')mount();if(k===' ')shoot();keys[{arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right'}[k]||'_']=true});addEventListener('keyup',e=>{let k=e.key.toLowerCase();keys[k]=false;keys[{arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right'}[k]||'_']=false});document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});document.getElementById('talk').onclick=talk;document.getElementById('horse').onclick=mount;document.getElementById('shoot').onclick=shoot;
</script></body></html>
